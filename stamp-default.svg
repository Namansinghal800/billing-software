<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <path id="circleTextPathOuter" d="M 100, 100 m -70, 0 a 70,70 0 1,1 140,0 a 70,70 0 1,1 -140,0" />
    <path id="circleTextPathInner" d="M 100, 100 m -50, 0 a 50,50 0 1,1 100,0 a 50,50 0 1,1 -100,0" />
  </defs>

  <g transform="rotate(-10 100 100)" opacity="0.88">
    <!-- Double Rings -->
    <circle cx="100" cy="100" r="92" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="800" stroke-linecap="round" />
    <circle cx="100" cy="100" r="84" fill="none" stroke="#dc2626" stroke-width="1.5" />
    <circle cx="100" cy="100" r="58" fill="none" stroke="#dc2626" stroke-width="1.8" />
    <circle cx="100" cy="100" r="54" fill="none" stroke="#dc2626" stroke-width="1" />

    <!-- Outer Circular Text -->
    <text font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="900" fill="#dc2626" letter-spacing="3.2">
      <textPath href="#circleTextPathOuter" startOffset="50%" text-anchor="middle">
        ★ APEX ENTERPRISES PVT LTD ★
      </textPath>
    </text>

    <!-- Center Box / Text -->
    <rect x="25" y="84" width="150" height="32" rx="4" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="1.5" />
    <text x="100" y="99" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1.5">
      AUTHORIZED
    </text>
    <text x="100" y="111" font-family="'Inter', Arial, sans-serif" font-size="9" font-weight="800" fill="#dc2626" text-anchor="middle" letter-spacing="1">
      SIGNATORY &amp; STAMP
    </text>

    <text x="100" y="132" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="1">
      OFFICIALLY VERIFIED
    </text>

    <text x="100" y="73" font-family="'Inter', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="1.5">
      GOVT REG. INVOICE
    </text>
  </g>
</svg>
